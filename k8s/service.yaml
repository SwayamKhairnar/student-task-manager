apiVersion: v1
kind: Service
metadata:
  name: task-manager-service
  labels:
    app: task-manager
spec:
  type: NodePort
  selector:
    app: task-manager
  ports:
    - port: 80            # Service port inside the cluster
      targetPort: 3000    # The container port the app listens on
      nodePort: 30080     # Fixed external port so Prometheus can always find it
      protocol: TCP
      name: http
